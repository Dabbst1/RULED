<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--navy:#0B1F4D;--blue:#1D4ED8;--sky:#3B82F6;--paper:#EAF2FF;--line:#C9DAF6;--green:#16A34A;--red:#DC2626;--amber:#D97706}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
body{font-family:"Inter Display","Inter",system-ui,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;background:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 79px,var(--line) 79px 81px)}
.margin{position:absolute;top:0;bottom:0;left:96px;width:3px;background:#F4A7A7;opacity:.7}
.dark .bg{background:#0B1220;background-image:repeating-linear-gradient(to bottom,transparent 0 79px,#16223B 79px 81px)}
.dark .margin{opacity:.25}
.dark{color:#E6EDFB}
.abs{position:absolute}
.h1{font-weight:800;font-size:104px;line-height:1.02;letter-spacing:-.035em}
.h2{font-weight:800;font-size:84px;line-height:1.04;letter-spacing:-.03em}
.sub{font-weight:500;font-size:44px;line-height:1.3;color:#3A4E7A}
.dark .sub{color:#9AABCF}
.blue{color:var(--blue)}
.dot{color:var(--sky)}
.phone{position:absolute;width:640px;height:1385px;border-radius:84px;background:#0A0F1C;padding:18px;box-shadow:0 40px 90px rgba(11,31,77,.35),0 0 0 3px #26324d inset}
.phone .scr{width:100%;height:100%;border-radius:68px;overflow:hidden;background:#F2F7FF;position:relative;padding-top:92px}
.dark .phone .scr{background:#0E1628}
.phone img{width:100%;display:block}
.phone .isl{position:absolute;top:34px;left:50%;width:170px;height:46px;margin-left:-85px;border-radius:30px;background:#000;z-index:3}
.call{position:absolute;color:var(--navy);background:#fff;border:4px solid var(--navy);border-radius:28px;padding:30px 36px;box-shadow:12px 12px 0 var(--navy);font-weight:700;font-size:44px;line-height:1.2}
.call small{display:block;font-weight:600;font-size:30px;color:#4A5E8A;margin-bottom:6px;letter-spacing:.01em}
.call b{font-weight:800}
.call.blue{border-color:var(--blue);box-shadow:12px 12px 0 var(--blue)}
.call.green{border-color:var(--green);box-shadow:12px 12px 0 var(--green)}
.call.red{border-color:var(--red);box-shadow:12px 12px 0 var(--red)}
.chip{position:absolute;color:var(--navy);background:#fff;border:3px solid var(--navy);border-radius:999px;padding:22px 34px;font-weight:700;font-size:40px;white-space:nowrap;display:flex;align-items:center;gap:18px;box-shadow:8px 8px 0 var(--navy)}
.chip i{width:22px;height:22px;border-radius:50%;background:var(--blue);display:inline-block}
.logo{font-weight:800;letter-spacing:-.04em}
.mono{width:300px;height:300px;border-radius:72px;background:var(--navy);display:flex;align-items:center;justify-content:center;position:absolute;box-shadow:0 30px 70px rgba(11,31,77,.35)}
.mono span{font-weight:800;font-size:200px;color:#fff;letter-spacing:-.05em;line-height:1;margin-left:-26px}
.mono em{position:absolute;width:46px;height:46px;border-radius:50%;background:var(--sky);right:62px;bottom:82px}
.btn{position:absolute;background:var(--blue);color:#fff;border-radius:28px;font-weight:800;font-size:56px;padding:40px 70px;box-shadow:0 18px 40px rgba(29,78,216,.4)}
.strike{position:absolute;height:12px;background:var(--red);border-radius:6px}
.count{font-variant-numeric:tabular-nums}
.tag{display:inline-block;background:var(--navy);color:#fff;border-radius:16px;padding:10px 22px;font-weight:700;font-size:34px;letter-spacing:.04em;text-transform:uppercase}
.dark .tag{background:var(--sky);color:#0B1220}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);               // ease out
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c=1.6;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const p=(t,a,d)=>clamp((t-a)/d);                    // progress of a segment
const money=v=>"$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=v=>"$"+Math.round(v).toLocaleString("en-US");

function el(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild}
function put(node,x,y,o={}){node.style.left=x+"px";node.style.top=y+"px";
  const s=o.s??1,r=o.r??0,op=o.o??1;node.style.transform=`translate(${o.tx||0}px,${o.ty||0}px) scale(${s}) rotate(${r}deg)`;node.style.opacity=op;
  if(o.origin)node.style.transformOrigin=o.origin;if(o.w)node.style.width=o.w+"px";stage.appendChild(node);return node}
function bg(dark){stage.className=dark?"dark":"";stage.appendChild(el('<div class="bg"></div>'));stage.appendChild(el('<div class="margin"></div>'))}
function text(cls,html,x,y,t0,t,o={}){ // rises in
  const k=eo(p(t,t0,.55));return put(el(`<div class="abs ${cls}">${html}</div>`),x,y,{ty:(1-k)*60,o:k,w:o.w,s:o.s})}
function words(cls,str,x,y,t0,t,step=.09,o={}){ // word by word
  const ws=str.split(" ");let h=ws.map((w,i)=>{const k=eo(p(t,t0+i*step,.45));return `<span style="display:inline-block;opacity:${k};transform:translateY(${(1-k)*50}px)">${w}</span>`}).join(" ");
  return put(el(`<div class="abs ${cls}">${h}</div>`),x,y,{w:o.w})}
function phone(src,x,y,t0,t,o={}){
  const k=eo(p(t,t0,.7)),fl=Math.sin((t-t0)*1.6)*8;
  const n=el(`<div class="phone"><div class="scr"><div class="isl"></div><img src="${src}" style="transform:translateY(${-(o.scroll||0)}px)"></div></div>`);
  return put(n,x,y-40,{ty:(1-k)*900+fl,r:(o.r||0)*(1-k)+(o.rr||0),o:1,s:o.s??.94,origin:"top center"})}
function call(cls,html,x,y,t0,t,o={}){const k=back(p(t,t0,.5));return put(el(`<div class="call ${cls}">${html}</div>`),x,y,{s:k,o:clamp(p(t,t0,.15)),origin:o.origin||"left center",w:o.w})}
function chip(html,x,y,t0,t){const k=back(p(t,t0,.45));return put(el(`<div class="chip">${html}</div>`),x,y,{s:k,o:clamp(p(t,t0,.12))})}
function outro(t,dur){ // quick white flash out at the end of each scene for punchy cuts
  const k=p(t,dur-.18,.18);if(k>0)put(el('<div class="flash"></div>'),0,0,{o:k*.0})}

const S={};
/* 1. Hook */
S.hook={d:4.2,f(t){bg();
  words("h1","Nobody ever taught you how to budget.",130,560,.15,t,.11,{w:840});
  const k=eo(p(t,1.9,.6));
  put(el(`<div class="abs sub" style="font-size:52px">You got a degree. A job offer.<br>But <b style="color:var(--navy)">zero</b> lessons on money.</div>`),130,1060,{o:k,ty:(1-k)*40});
  const k2=back(p(t,3.0,.5));
  put(el(`<div class="abs tag">That’s not your fault.</div>`),130,1330,{s:k2,o:clamp(p(t,3.0,.1)),origin:"left center"});
}};
/* 2. Brand */
S.brand={d:3.4,f(t){bg();
  const k=back(p(t,.05,.6));put(el('<div class="mono"><span>M</span><em></em></div>'),390,520,{s:k,r:(1-eo(p(t,.05,.6)))*-12});
  text("h1 logo",'Monerem<span class="dot">.</span>',W/2-300,900,.45,t,{w:620});
  const st=stage.lastChild;st.style.textAlign="center";st.style.fontSize="140px";
  text("sub",'Budgeting tools that <b style="color:var(--blue)">do the math</b> and<br>explain it in plain English.',140,1120,.9,t,{w:800});stage.lastChild.style.textAlign="center";
}};
/* 3. Paycheck */
S.pay={d:4.8,f(t){bg();
  text("tag","Paycheck tool",96+34,150,.0,t);
  words("h2","What will my paycheck actually be?",130,240,.1,t,.07,{w:860});
  phone("shots/pay.jpg",220,560,.25,t,{r:6});
  call("",'<small>$52,000 salary</small>',70,690,1.2,t);
  const n=eo(p(t,1.6,1.1));
  call("blue",`<small>Take-home, every 2 weeks</small><span class="count" style="font-size:72px;font-weight:800">${money(1690.85*n)}</span>`,520,1340,1.55,t,{origin:"right center"});
  chip('<i></i>One tap into your budget',150,1700,3.2,t);
}};
/* 4. Afford */
S.afford={d:4.6,f(t){bg();
  text("tag","Can I afford it?",130,150,0,t);
  words("h2","Check before you sign the lease.",130,240,.1,t,.07,{w:860});
  phone("shots/afford.jpg",380,560,.25,t,{r:-6});
  call("",'<small>Rent + utilities</small><b style="font-size:60px">$1,550/mo</b>',60,760,1.1,t);
  call("red",'<small>Verdict</small>42% of your pay.<br>Too thin. Aim for 30%.',60,1180,1.8,t,{w:620});
  chip('<i style="background:var(--green)"></i>Cars & big purchases too',130,1720,3.0,t);
}};
/* 5. Subscriptions */
S.subs={d:4.6,f(t){bg();
  text("tag","Subscription finder",130,150,0,t);
  words("h2","Find the subscriptions you forgot.",130,240,.1,t,.07,{w:880});
  phone("shots/subs.jpg",220,560,.25,t,{r:5});
  const n=eo(p(t,1.4,1.3));
  call("red",`<small>Costing you</small><span class="count" style="font-size:80px;font-weight:800">${money0(893.40*n)}</span><span style="font-size:40px"> a year</span>`,470,1300,1.3,t,{origin:"right center"});
  chip('<i></i>Spotted from your bank',70,780,2.4,t);
}};
/* 6. Roadmap */
S.road={d:4.8,f(t){bg();
  text("tag","Money roadmap",130,150,0,t);
  words("h2","Know exactly what to do next.",130,240,.1,t,.07,{w:860});
  phone("shots/roadmap.jpg",380,560,.25,t,{r:-5});
  const steps=["$1,000 emergency fund","Get your 401(k) match","Pay off high-interest debt","Save 3 months"];
  steps.forEach((s,i)=>{const k=back(p(t,1.1+i*.32,.45));
    put(el(`<div class="chip" style="font-size:34px;padding:18px 28px"><i style="background:${i===0?"var(--blue)":"#9AB4E8"}"></i>${i+1}. ${s}</div>`),60,760+i*150,{s:k,o:clamp(p(t,1.1+i*.32,.1)),origin:"left center"})});
  call("green",'<small>Every week</small>5-minute check-in<br>+ your streak 🔥',60,1430,2.7,t,{w:560});
}};
/* 7. Net worth + rollover */
S.grow={d:4.6,f(t){bg();
  text("tag","Watch it grow",130,150,0,t);
  words("h2","Net worth, rollover, and real reports.",130,240,.1,t,.07,{w:880});
  phone("shots/networth.jpg",60,620,.2,t,{r:-7,rr:-4,s:.74});
  phone("shots/rollover.jpg",400,700,.45,t,{r:7,rr:4,s:.74});
  const n=eo(p(t,1.3,1.2));
  call("blue",`<small>Your net worth</small><span class="count" style="font-size:68px;font-weight:800">${money(1877.82*n)}</span>`,90,1530,1.2,t);
  call("green",'<small>Rolled over</small><b style="font-size:60px">+$130</b>',650,1470,2.2,t);
}};
/* 8. Learn */
S.learn={d:4.2,f(t){bg();
  text("tag","Learn as you go",130,150,0,t);
  words("h2","Every money word, explained.",130,240,.1,t,.07,{w:860});
  phone("shots/learn.jpg",220,560,.25,t,{r:5});
  ["401(k) match","APR","Tax bracket","Emergency fund","Student loans"].forEach((w,i)=>{
    const pos=[[40,780],[690,900],[60,1120],[620,1330],[90,1560]][i];chip('<i style="background:var(--sky)"></i>'+w+' <b style="color:var(--blue)">?</b>',pos[0],pos[1],1.0+i*.25,t)});
}};
/* 9. Works like an app */
S.app={d:4.6,f(t){const dk=t>2.1;bg(dk);
  const tg=text("tag","Works like an app",130,150,0,t);
  words("h2",dk?"Dark mode, too.":"Install it on your phone.",130,240,dk?2.1:.1,t,.07,{w:860});
  phone(dk?"shotsd/pay.jpg":"shots/home.jpg",220,560,dk?2.1:.25,t,{r:dk?0:-5});
  if(!dk){chip('<i></i>Add to Home Screen',60,820,.9,t);chip('<i style="background:var(--green)"></i>Link your bank',560,1080,1.15,t);chip('<i style="background:var(--amber)"></i>Bill reminders',60,1380,1.4,t)}
  else{chip('<i></i>Matches your phone',560,1500,2.7,t)}
  const fl=1-clamp(Math.abs(t-2.1)/.12);if(fl>0)put(el('<div class="flash"></div>'),0,0,{o:fl})
}};
/* 10. CTA */
S.cta={d:5.4,f(t){bg();
  const k=back(p(t,.05,.55));put(el('<div class="mono" style="width:220px;height:220px;border-radius:54px"><span style="font-size:146px;margin-left:-20px">M</span><em style="width:34px;height:34px;right:44px;bottom:60px"></em></div>'),430,300,{s:k});
  words("h1","Learn money. Plan your life.",130,620,.35,t,.12,{w:840});
  stage.lastChild.style.textAlign="center";
  text("sub",'Built for new grads and anyone<br>who was never taught.',140,1000,1.1,t,{w:800});stage.lastChild.style.textAlign="center";
  const kb=back(p(t,1.7,.55));put(el('<div class="btn">Start 14 days free</div>'),W/2-310,1220,{s:kb,o:clamp(p(t,1.7,.12)),w:620});stage.lastChild.style.textAlign="center";
  text("sub",'<b style="color:var(--navy)">$9/month</b> or <b style="color:var(--navy)">$79/year</b>',140,1460,2.2,t,{w:800});stage.lastChild.style.textAlign="center";
  text("sub",'<span style="font-weight:700;color:var(--blue);font-size:50px">monerem.com</span>',140,1620,2.6,t,{w:800});stage.lastChild.style.textAlign="center";
}};
window.SCENES=S;
window.render=function(name,t){stage.innerHTML="";S[name].f(t)};
window.ready=Promise.all([document.fonts.ready]);
</script></body></html>
